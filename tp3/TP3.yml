---
- name: Installer apache2 et mysqlserver
  hosts: all

  tasks:
    - name: Install apache2 mysql-server on Ubuntu
      ansible.builtin.apt:
        update_cache: true
        name: "{{ item }}"
        state: present
      loop:
        - apache2
        - mysql-server
      when: "inventory_hostname in groups['apache']"

    - name: Install git nginx and cowsay 
  
      ansible.builtin.apt:
        update_cache: true
        name: "{{ item }}"
        state: present
      loop:
        - git
        - nginx
        - cowsay
      when: "inventory_hostname in groups['node3']"

    - name : Install ufw on Ubuntu machine

      ansible.builtin.apt:
        update_cache: true
        name: ufw
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Gather the rpm package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Copy index.html if apache2 or nginx is installed
      ansible.builtin.template:
        src: templates/index.j2
        dest: /var/www/html/index.html
        mode: '0644'
      when: "'apache2' in ansible_facts.packages or 'nginx' in ansible_facts.packages"

    - name: Start apache2
      ansible.builtin.service:
        name: apache2
        state: started
      when: "'apache2' in ansible_facts.packages"

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
      when: "'nginx' in ansible_facts.packages"

    - name: Quelle est heure est-il? 
      debug: 
        msg: "il est {{ ansible_date_time.hour }}" 

    - name: Quel jour sommes nous? 
      debug: 
        msg: "Nous sommes le  {{ ansible_date_time.day }}" 
    