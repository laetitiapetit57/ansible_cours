---
# Playbook pour configurer un serveur web
- name: Installation de wordpress
  hosts: serveur_web
  vars_files: vars/main.yml

  tasks:
    - name: Installation de Apache
      ansible.builtin.include_role:
        name: geerlingguy.apache
    
    - name: Installation de php
      ansible.builtin.include_role:
        name: geerlingguy.php

    - name: Installation de fpm
      ansible.builtin.include_role:
        name: geerlingguy.apache-php-fpm
      
    - name: Create wordpress directory
      ansible.builtin.file:
        path: /var/www/wordpress/
        state: directory
        recurse: true

    - name: Download and unarchive wordpress
      ansible.builtin.unarchive:
        src: https://fr.wordpress.org/latest-fr_FR.zip
        dest: /var/www/
        remote_src: true
    

